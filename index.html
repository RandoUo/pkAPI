<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon TCG Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Pokémon TCG + Giphy Explorer</h1>
    <p>Busque cartas, veja GIFs e descubra curiosidades!</p>
  </header>

  <main>
    <section class="search-box">
      <input type="text" id="searchInput" placeholder="Digite o nome de um Pokémon (ex: Charizard)" />
      <button id="searchBtn">Buscar</button>
    </section>

    <p id="feedback" class="feedback"></p>

    <section id="cards" class="cards"></section>

    <section class="sets-section">
      <h2>Coleções (Sets)</h2>
      <ul id="setList" class="sets"></ul>
    </section>
  </main>

  <!-- Modal de detalhes -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>
    <p>© 2025 — Projeto Acadêmico - Edaurdo Siqueira | APIs Pokémon TCG + Giphy</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
