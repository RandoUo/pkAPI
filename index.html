<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pokémon TCG Explorer</h1>
    <p>Desenvolvido por Eduardo — Sistemas de Informação</p>
  </header>

  <main>
    <section class="search-box">
      <input type="text" id="searchInput" placeholder="Digite o nome de um Pokémon (ex: Charizard)">
      <button id="searchBtn">Buscar</button>
    </section>

    <section id="feedback" class="feedback"></section>

    <section id="gifSection" class="gifs-section">
      <h2>GIFs do Pokémon</h2>
      <div id="gifs" class="gifs"></div>
    </section>

    <section id="cards" class="cards"></section>

    <section class="sets-section">
      <h2>Coleções (Sets)</h2>
      <ul id="setList" class="sets"></ul>
    </section>
  </main>

  <footer>
    <p>© 2025 — Trabalho acadêmico | APIs: Pokémon TCG + GIPHY</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
