<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeDex + Gifs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>PokéDex Interativa</h1>
    <p>Busque cartas e GIFs dos seus Pokémon favoritos!</p>
  </header>

  <main>
    <section class="search-section">
      <div class="search-box">
        <h2>Buscar Cartas</h2>
        <input id="searchCardsInput" type="text" placeholder="Ex: Pikachu" />
        <button id="searchCardsBtn">🔍 Pesquisar</button>
      </div>

      <div class="search-box">
        <h2>Buscar GIFs</h2>
        <input id="searchGifsInput" type="text" placeholder="Ex: Charizard" />
        <button id="searchGifsBtn">🎞️ Pesquisar</button>
      </div>
    </section>

    <section id="sets">
      <h2>Principais Coleções</h2>
      <ul id="setList"><li>Carregando coleções...</li></ul>
    </section>

    <section id="cards">
      <h2>Cartas Encontradas</h2>
      <div id="cardsContainer" class="grid"></div>
    </section>

    <section id="gifs">
      <h2>GIFs Pokémon</h2>
      <div id="gifsContainer" class="grid"></div>
    </section>
  </main>

  <footer>
    <p>Feito usando Pokémon TCG API + Giphy API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
